<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Echo Vaults — Vertical Slice</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0e; overflow: hidden; }
  canvas { display: block; }
  #hint { position: fixed; left: 0; right: 0; bottom: 8px; text-align: center;
          color: #888; font: 12px/1.4 system-ui, sans-serif; pointer-events: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hint">Click the game once if keys don't respond.</div>
<script>
"use strict";
/* ============================================================================
   ECHO VAULTS — single-file vertical slice (web port of the Godot Fas 1 design)
   Core loop: Enter -> loot -> shoot -> extract (or die).
   Everything is in this one file. Just open it in a browser.

   Future layers (hub, crafting, bosses, meta-progression) would hook in around
   the gameState machine and the DATA tables below — see comments.
   ========================================================================== */

/* ---------- DATA (data-driven config; add content here, not in the logic) -- */
const WEAPONS = {
  pistol: { name: "Echo Pistol", damage: 16, fireRate: 6, projSpeed: 760,
            spread: 3, mag: 14, reload: 1.1, noise: 280, projColor: "#ffe14d" }
};
const ENEMIES = {
  guard: { name: "Vault Guard", maxHp: 45, speed: 95, damage: 9, attackRange: 340,
           fireRate: 1.6, hearing: 280, sight: 380, color: "#d95252", lootChance: 0.5 }
};
const LOOT = {
  medkit: { name: "Medkit", color: "#4de372", value: 120 }
};
const VAULTS = {
  industrial: { name: "Industrial Vault 01", raidTime: 75, loot: "medkit", enemy: "guard" }
};

/* ---------- WORLD ---------------------------------------------------------- */
const WORLD = { w: 1400, h: 1000 };
const WALL_DATA = [
  // outer walls
  { x: 0,    y: 0,   w: 1400, h: 40  },
  { x: 0,    y: 960, w: 1400, h: 40  },
  { x: 0,    y: 0,   w: 40,   h: 1000 },
  { x: 1360, y: 0,   w: 40,   h: 1000 },
  // inner cover / sight blockers
  { x: 300,  y: 250, w: 220,  h: 40  },
  { x: 850,  y: 200, w: 40,   h: 260 },
  { x: 640,  y: 480, w: 160,  h: 120 },
  { x: 300,  y: 650, w: 40,   h: 220 },
  { x: 950,  y: 680, w: 240,  h: 40  }
];
const ENEMY_SPAWNS = [
  { x: 1000, y: 300 }, { x: 500, y: 200 }, { x: 1150, y: 750 },
  { x: 350,  y: 470 }, { x: 800, y: 820 }
];
const LOOT_SPAWNS = [
  { x: 250, y: 320 }, { x: 920, y: 250 }, { x: 1120, y: 520 },
  { x: 450, y: 760 }, { x: 700, y: 640 }
];
const EXTRACTION = { x: 1240, y: 850, r: 55 };
const PLAYER_SPAWN = { x: 120, y: 860 };
const BULLET_R = 4;

/* ---------- CANVAS / INPUT ------------------------------------------------- */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let CW = 0, CH = 0;
function resize() { CW = canvas.width = window.innerWidth; CH = canvas.height = window.innerHeight; }
window.addEventListener("resize", resize);
resize();

const keys = {};
let mouseDown = false;
const mouseScreen = { x: 0, y: 0 };

window.addEventListener("keydown", (e) => {
  if ([" ", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) e.preventDefault();
  if (e.code === "Space" && game.state === "playing") tryDodge();
  if (e.code === "Enter" && game.state === "result") startGame();
  keys[e.code] = true;
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });
canvas.addEventListener("mousemove", (e) => {
  const r = canvas.getBoundingClientRect();
  mouseScreen.x = e.clientX - r.left;
  mouseScreen.y = e.clientY - r.top;
});
canvas.addEventListener("mousedown", () => {
  if (game.state === "result") { startGame(); return; }
  mouseDown = true;
});
window.addEventListener("mouseup", () => { mouseDown = false; });

/* ---------- GAME STATE ----------------------------------------------------- */
const game = {
  state: "boot",            // boot -> playing -> result
  run: null,                // run-only data (timer, loot) — never persisted
  player: null,
  enemies: [],
  bullets: [],
  pickups: [],
  cam: { x: 0, y: 0 },
  noiseFlashes: []          // purely visual feedback for emitted noise
};

function startGame() {
  const vault = VAULTS.industrial;
  game.run = { vault, timeLeft: vault.raidTime, loot: 0, alarm: false };
  game.player = makePlayer();
  game.enemies = ENEMY_SPAWNS.map((s) => makeEnemy(ENEMIES[vault.enemy], s.x, s.y));
  game.bullets = [];
  game.pickups = LOOT_SPAWNS.map((s) => ({ x: s.x, y: s.y, item: LOOT[vault.loot] }));
  game.noiseFlashes = [];
  game.state = "playing";
}

function makePlayer() {
  const wpn = WEAPONS.pistol;
  return {
    x: PLAYER_SPAWN.x, y: PLAYER_SPAWN.y, r: 14,
    hp: 100, maxHp: 100, speed: 220, sprintMul: 1.6,
    aim: { x: 1, y: 0 }, weapon: wpn,
    fireCd: 0, ammo: wpn.mag, reloading: false, reloadLeft: 0,
    dodging: false, dodgeLeft: 0, dodgeCd: 0, dodgeDir: { x: 0, y: 0 }, noiseT: 0,
    dead: false
  };
}

function makeEnemy(data, x, y) {
  return {
    x, y, r: 13, data, hp: data.maxHp,
    state: "patrol", origin: { x, y }, target: { x, y }, wait: 0,
    lastKnown: { x, y }, searchT: 0, lostT: 0, fireCd: 0
  };
}

/* ---------- MATH / COLLISION ----------------------------------------------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
function norm(x, y) { const l = Math.hypot(x, y) || 1; return { x: x / l, y: y / l }; }

function circleRect(cx, cy, r, w) {
  const nx = clamp(cx, w.x, w.x + w.w);
  const ny = clamp(cy, w.y, w.y + w.h);
  return dist(cx, cy, nx, ny) < r;
}
function pointInWall(px, py, w) {
  return px >= w.x && px <= w.x + w.w && py >= w.y && py <= w.y + w.h;
}
// Axis-separated movement so entities slide along walls instead of sticking.
function tryMove(ent, dx, dy) {
  ent.x += dx;
  for (const w of WALL_DATA) {
    if (circleRect(ent.x, ent.y, ent.r, w)) {
      if (dx > 0) ent.x = w.x - ent.r;
      else if (dx < 0) ent.x = w.x + w.w + ent.r;
    }
  }
  ent.y += dy;
  for (const w of WALL_DATA) {
    if (circleRect(ent.x, ent.y, ent.r, w)) {
      if (dy > 0) ent.y = w.y - ent.r;
      else if (dy < 0) ent.y = w.y + w.h + ent.r;
    }
  }
}
// Line of sight: sample the segment; blocked if any sample is inside a wall.
function losClear(ax, ay, bx, by) {
  const d = dist(ax, ay, bx, by);
  const steps = Math.ceil(d / 6);
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    const px = ax + (bx - ax) * t, py = ay + (by - ay) * t;
    for (const w of WALL_DATA) if (pointInWall(px, py, w)) return false;
  }
  return true;
}

/* ---------- EVENTS (lightweight stand-in for the EventBus) ----------------- */
function emitNoise(x, y, radius, source) {
  game.noiseFlashes.push({ x, y, r: radius, life: 0.25 });
  for (const e of game.enemies) {
    if (e === source) continue;
    if (dist(e.x, e.y, x, y) <= radius && e.state !== "chase") {
      e.state = "search"; e.lastKnown = { x, y }; e.searchT = 0;
    }
  }
}

/* ---------- BULLETS -------------------------------------------------------- */
function spawnBullet(x, y, dir, speed, dmg, color, fromPlayer) {
  game.bullets.push({ x, y, vx: dir.x * speed, vy: dir.y * speed, dmg, color, fromPlayer, life: 2 });
}
function updateBullets(dt) {
  const p = game.player;
  for (const b of game.bullets) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0) { b.dead = true; continue; }
    for (const w of WALL_DATA) if (pointInWall(b.x, b.y, w)) { b.dead = true; break; }
    if (b.dead) continue;
    if (b.fromPlayer) {
      for (const e of game.enemies) {
        if (dist(b.x, b.y, e.x, e.y) < e.r + BULLET_R) { damageEnemy(e, b.dmg); b.dead = true; break; }
      }
    } else if (!p.dead) {
      if (dist(b.x, b.y, p.x, p.y) < p.r + BULLET_R) { damagePlayer(b.dmg); b.dead = true; }
    }
  }
  game.bullets = game.bullets.filter((b) => !b.dead);
}

/* ---------- PLAYER --------------------------------------------------------- */
function tryDodge() {
  const p = game.player;
  if (!p || p.dead || p.dodging || p.dodgeCd > 0) return;
  let ix = 0, iy = 0;
  if (keys["KeyD"]) ix += 1; if (keys["KeyA"]) ix -= 1;
  if (keys["KeyS"]) iy += 1; if (keys["KeyW"]) iy -= 1;
  if (ix === 0 && iy === 0) return;
  p.dodgeDir = norm(ix, iy);
  p.dodging = true; p.dodgeLeft = 0.18; p.dodgeCd = 0.6;
}
function damagePlayer(amount) {
  const p = game.player;
  if (p.dead || p.dodging) return;          // i-frames during dodge
  p.hp -= amount;
  if (p.hp <= 0) { p.hp = 0; p.dead = true; endRun(false); }
}
function updatePlayer(dt) {
  const p = game.player;
  if (p.dead) return;
  if (p.dodgeCd > 0) p.dodgeCd -= dt;

  // aim toward mouse (convert screen -> world)
  const mwx = mouseScreen.x + game.cam.x, mwy = mouseScreen.y + game.cam.y;
  const a = norm(mwx - p.x, mwy - p.y);
  if (a.x || a.y) p.aim = a;

  if (p.dodging) {
    p.dodgeLeft -= dt;
    tryMove(p, p.dodgeDir.x * 620 * dt, p.dodgeDir.y * 620 * dt);
    if (p.dodgeLeft <= 0) p.dodging = false;
    return;
  }

  // weapon timers
  if (p.fireCd > 0) p.fireCd -= dt;
  if (p.reloading) { p.reloadLeft -= dt; if (p.reloadLeft <= 0) { p.ammo = p.weapon.mag; p.reloading = false; } }

  let ix = 0, iy = 0;
  if (keys["KeyD"]) ix += 1; if (keys["KeyA"]) ix -= 1;
  if (keys["KeyS"]) iy += 1; if (keys["KeyW"]) iy -= 1;
  const moving = ix !== 0 || iy !== 0;
  const sprinting = moving && (keys["ShiftLeft"] || keys["ShiftRight"]);
  const dir = norm(ix, iy);
  const speed = p.speed * (sprinting ? p.sprintMul : 1);
  if (moving) tryMove(p, dir.x * speed * dt, dir.y * speed * dt);

  // movement noise feeds the Tension Loop (throttled)
  p.noiseT -= dt;
  if (p.noiseT <= 0 && moving) { p.noiseT = 0.2; emitNoise(p.x, p.y, sprinting ? 300 : 130, p); }

  if ((keys["KeyR"]) && !p.reloading && p.ammo < p.weapon.mag) { p.reloading = true; p.reloadLeft = p.weapon.reload; }

  if (mouseDown) tryFire();

  // pickups
  for (const lp of game.pickups) {
    if (!lp.taken && dist(p.x, p.y, lp.x, lp.y) < p.r + 12) { lp.taken = true; game.run.loot++; }
  }
  game.pickups = game.pickups.filter((lp) => !lp.taken);
}
function tryFire() {
  const p = game.player;
  if (p.fireCd > 0 || p.reloading || p.ammo <= 0) return;
  p.ammo--;
  p.fireCd = 1 / p.weapon.fireRate;
  const spread = (p.weapon.spread * Math.PI / 180);
  const ang = Math.atan2(p.aim.y, p.aim.x) + (Math.random() * 2 - 1) * spread;
  const dir = { x: Math.cos(ang), y: Math.sin(ang) };
  spawnBullet(p.x + p.aim.x * 22, p.y + p.aim.y * 22, dir, p.weapon.projSpeed, p.weapon.damage, p.weapon.projColor, true);
  if (p.ammo <= 0) { p.reloading = true; p.reloadLeft = p.weapon.reload; }
  emitNoise(p.x, p.y, p.weapon.noise, p);
}

/* ---------- ENEMIES (Patrol / Search / Chase state machine) ---------------- */
function damageEnemy(e, amount) {
  e.hp -= amount;
  e.lastKnown = { x: game.player.x, y: game.player.y };
  if (e.state !== "chase") e.state = "chase";
  if (e.hp <= 0) killEnemy(e);
}
function killEnemy(e) {
  e.dead = true;
  if (Math.random() < e.data.lootChance) {
    game.pickups.push({ x: e.x, y: e.y, item: LOOT[game.run.vault.loot] });
  }
}
function seesPlayer(e) {
  const p = game.player;
  if (p.dead) return false;
  return dist(e.x, e.y, p.x, p.y) <= e.data.sight && losClear(e.x, e.y, p.x, p.y);
}
function moveToward(e, tx, ty, dt) {
  const d = dist(e.x, e.y, tx, ty);
  if (d < 5) return;
  const dir = norm(tx - e.x, ty - e.y);
  tryMove(e, dir.x * e.data.speed * dt, dir.y * e.data.speed * dt);
}
function enemyShoot(e, dt) {
  e.fireCd -= dt;
  if (e.fireCd > 0) return;
  e.fireCd = 1 / e.data.fireRate;
  const p = game.player;
  const dir = norm(p.x - e.x, p.y - e.y);
  spawnBullet(e.x + dir.x * 18, e.y + dir.y * 18, dir, 520, e.data.damage, "#ff7333", false);
  emitNoise(e.x, e.y, 200, e);
}
function updateEnemy(e, dt) {
  const p = game.player;
  if (e.state === "patrol") {
    if (seesPlayer(e)) { e.state = "chase"; e.lastKnown = { x: p.x, y: p.y }; return; }
    moveToward(e, e.target.x, e.target.y, dt);
    if (dist(e.x, e.y, e.target.x, e.target.y) < 10) {
      e.wait -= dt;
      if (e.wait <= 0) {
        e.target = { x: e.origin.x + (Math.random() * 260 - 130), y: e.origin.y + (Math.random() * 260 - 130) };
        e.wait = 0.6 + Math.random();
      }
    }
  } else if (e.state === "search") {
    if (seesPlayer(e)) { e.state = "chase"; e.lastKnown = { x: p.x, y: p.y }; return; }
    moveToward(e, e.lastKnown.x, e.lastKnown.y, dt);
    e.searchT += dt;
    if (dist(e.x, e.y, e.lastKnown.x, e.lastKnown.y) < 12 || e.searchT > 4) e.state = "patrol";
  } else { // chase
    if (seesPlayer(e)) {
      e.lostT = 0; e.lastKnown = { x: p.x, y: p.y };
      if (dist(e.x, e.y, p.x, p.y) > e.data.attackRange) moveToward(e, p.x, p.y, dt);
      else enemyShoot(e, dt);
    } else {
      e.lostT += dt;
      moveToward(e, e.lastKnown.x, e.lastKnown.y, dt);
      if (e.lostT > 2.5) e.state = "search";
    }
  }
}

/* ---------- RUN / EXTRACTION ----------------------------------------------- */
function endRun(extracted) {
  game.run.result = extracted;
  game.state = "result";
}
function updateRun(dt) {
  const r = game.run;
  r.timeLeft -= dt;
  if (r.timeLeft <= 0 && !r.alarm) {
    r.timeLeft = 0; r.alarm = true;
    for (const e of game.enemies) {            // alarm: everyone hunts the player
      if (e.state !== "chase") { e.state = "search"; e.lastKnown = { x: game.player.x, y: game.player.y }; e.searchT = 0; }
    }
  }
  // extraction: hold inside the pad
  const p = game.player;
  if (!r.extractDone) {
    if (!p.dead && dist(p.x, p.y, EXTRACTION.x, EXTRACTION.y) < EXTRACTION.r) {
      r.extractT = (r.extractT || 0) + dt;
      if (r.extractT >= 3) { r.extractDone = true; endRun(true); }
    } else r.extractT = 0;
  }
}

/* ---------- UPDATE / DRAW -------------------------------------------------- */
function update(dt) {
  if (game.state !== "playing") return;
  updatePlayer(dt);
  for (const e of game.enemies) updateEnemy(e, dt);
  game.enemies = game.enemies.filter((e) => !e.dead);
  updateBullets(dt);
  updateRun(dt);
  for (const f of game.noiseFlashes) f.life -= dt;
  game.noiseFlashes = game.noiseFlashes.filter((f) => f.life > 0);
  // camera
  game.cam.x = game.player.x - CW / 2;
  game.cam.y = game.player.y - CH / 2;
}

function draw() {
  ctx.fillStyle = "#0a0a0e";
  ctx.fillRect(0, 0, CW, CH);
  if (game.state === "boot") return;

  ctx.save();
  ctx.translate(-game.cam.x, -game.cam.y);

  // floor
  ctx.fillStyle = "#15151c";
  ctx.fillRect(0, 0, WORLD.w, WORLD.h);
  // subtle grid
  ctx.strokeStyle = "#1d1d27"; ctx.lineWidth = 1;
  for (let gx = 0; gx <= WORLD.w; gx += 80) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, WORLD.h); ctx.stroke(); }
  for (let gy = 0; gy <= WORLD.h; gy += 80) { ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(WORLD.w, gy); ctx.stroke(); }

  // extraction pad
  const ex = EXTRACTION;
  ctx.fillStyle = "rgba(50,200,110,0.18)";
  ctx.beginPath(); ctx.arc(ex.x, ex.y, ex.r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "rgba(80,255,140,0.7)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(ex.x, ex.y, ex.r, 0, Math.PI * 2); ctx.stroke();
  if (game.run && game.run.extractT > 0 && !game.run.extractDone) {
    const frac = clamp(game.run.extractT / 3, 0, 1);
    ctx.strokeStyle = "#5dff8c"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(ex.x, ex.y, ex.r + 6, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac); ctx.stroke();
  }
  ctx.fillStyle = "#5dff8c"; ctx.font = "13px system-ui"; ctx.textAlign = "center";
  ctx.fillText("EXTRACT", ex.x, ex.y + 4);

  // noise flashes
  for (const f of game.noiseFlashes) {
    ctx.strokeStyle = "rgba(255,230,120," + (f.life / 0.25 * 0.4).toFixed(3) + ")";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.stroke();
  }

  // pickups
  for (const lp of game.pickups) {
    ctx.fillStyle = lp.item.color;
    ctx.fillRect(lp.x - 9, lp.y - 9, 18, 18);
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5;
    ctx.strokeRect(lp.x - 9, lp.y - 9, 18, 18);
  }

  // walls
  ctx.fillStyle = "#383846";
  for (const w of WALL_DATA) ctx.fillRect(w.x, w.y, w.w, w.h);

  // bullets
  for (const b of game.bullets) {
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.arc(b.x, b.y, BULLET_R, 0, Math.PI * 2); ctx.fill();
  }

  // enemies
  for (const e of game.enemies) {
    ctx.fillStyle = e.data.color;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill();
    // state pip
    ctx.fillStyle = e.state === "chase" ? "#ff4040" : (e.state === "search" ? "#ffd040" : "#7a7a7a");
    ctx.beginPath(); ctx.arc(e.x, e.y - e.r - 6, 3, 0, Math.PI * 2); ctx.fill();
  }

  // player
  const p = game.player;
  ctx.fillStyle = p.dead ? "#595959" : "#3f99ff";
  ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  if (!p.dead) {
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + p.aim.x * 26, p.y + p.aim.y * 26); ctx.stroke();
  }

  ctx.restore();

  drawHUD();
}

function drawHUD() {
  const p = game.player, r = game.run;
  ctx.textAlign = "left";
  ctx.font = "18px ui-monospace, monospace";
  let y = 28;
  const line = (s, col) => { ctx.fillStyle = col || "#e8e8ef"; ctx.fillText(s, 16, y); y += 24; };
  line("TIME  " + r.timeLeft.toFixed(1));
  if (r.alarm) line("** ALARM — enemies hunting **", "#ff6b6b");
  line("HP    " + Math.max(0, Math.round(p.hp)));
  line("AMMO  " + p.ammo + " / " + p.weapon.mag + (p.reloading ? "  (reloading)" : ""));
  line("LOOT  " + r.loot);

  ctx.fillStyle = "rgba(255,255,255,0.55)";
  ctx.font = "13px system-ui";
  ctx.fillText("WASD move · Shift sprint · Space dodge · Mouse aim · LMB fire · R reload", 16, CH - 18);

  if (game.state === "result") {
    ctx.fillStyle = "rgba(0,0,0,0.7)";
    ctx.fillRect(0, 0, CW, CH);
    ctx.textAlign = "center";
    ctx.fillStyle = r.result ? "#5dff8c" : "#ff6b6b";
    ctx.font = "bold 56px system-ui";
    ctx.fillText(r.result ? "EXTRACTED" : "YOU DIED", CW / 2, CH / 2 - 30);
    ctx.fillStyle = "#fff"; ctx.font = "24px system-ui";
    ctx.fillText((r.result ? "Loot secured: " : "Loot lost: ") + r.loot, CW / 2, CH / 2 + 20);
    ctx.fillStyle = "rgba(255,255,255,0.7)"; ctx.font = "18px system-ui";
    ctx.fillText("Press ENTER or click to play again", CW / 2, CH / 2 + 70);
  }
}

/* ---------- MAIN LOOP ------------------------------------------------------ */
let last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;     // clamp to avoid tunneling on lag/tab-switch
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
startGame();
requestAnimationFrame(loop);
</script>
</body>
</html>
